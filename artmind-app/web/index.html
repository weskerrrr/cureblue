<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060c" />
    <meta name="description" content="心绘 ArtMind — 用语音带路的艺术疗愈。视障用户听得清，明眼用户看得懂。" />
    <title>心绘 ArtMind · AI 艺术疗愈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-contrast="normal" data-fontscale="1">
    <!-- 跳转到主内容：键盘/读屏用户可达 -->
    <a class="skip-link" href="#main">跳到主内容</a>

    <!-- 全局无障碍播报区：所有状态变化通过这里朗读 -->
    <div id="live-polite" class="sr-only" aria-live="polite" role="status"></div>
    <div id="live-assertive" class="sr-only" aria-live="assertive" role="alert"></div>

    <!-- 顶部无障碍工具条 -->
    <header class="topbar room-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">心绘</span>
      </div>
      <div class="room-dots" id="room-dots" aria-hidden="true"></div>
      <select id="role-select" aria-label="当前用户角色">
        <option value="blind">视障</option>
        <option value="deaf">听障</option>
        <option value="therapist">疗愈师</option>
        <option value="parent">家长</option>
      </select>
      <span id="plan-badge" class="plan-badge plan-free">免费版</span>
    </header>

    <div class="peek peek-left" id="peek-left" aria-hidden="true"></div>
    <div class="peek peek-right" id="peek-right" aria-hidden="true"></div>

    <main id="main" class="deck" tabindex="-1">
      <section id="view-studio" class="room view" data-room="studio" aria-label="创作"></section>
      <section id="view-tasks" class="room view" data-room="tasks" aria-label="疗愈"></section>
      <section id="view-gallery" class="room view" data-room="gallery" aria-label="欣赏"></section>
      <section id="view-community" class="room view" data-room="community" aria-label="社区"></section>
      <section id="view-subscribe" class="room view" data-room="subscribe" aria-label="会员"></section>
    </main>

    <div class="a11y-tools room-tools" hidden>
      <button id="btn-voice" class="tool" aria-pressed="false" aria-label="语音操控：关闭">语音</button>
      <button id="btn-contrast" class="tool" aria-pressed="false" aria-label="高对比模式：关闭">高对比</button>
      <button id="btn-font-dec" class="tool" aria-label="减小字号">A−</button>
      <button id="btn-font-inc" class="tool" aria-label="增大字号">A+</button>
      <button id="btn-captions" class="tool" aria-pressed="true" aria-label="字幕：开启">字幕</button>
      <div id="voice-hint" hidden></div>
      <button id="btn-replay" type="button">再听一遍</button>
      <p id="now-kicker"></p>
      <p id="now-line"></p>
    </div>

    <!-- 字幕条：所有语音播报同步显示文字 -->
    <div id="caption-bar" class="caption-bar" aria-hidden="true">
      <span class="caption-icon">💬</span>
      <span id="caption-text">字幕已开启，语音内容将同步显示在这里。</span>
    </div>

    <!-- Paywall 弹窗 -->
    <div id="paywall" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="paywall-title">
      <div class="modal-card">
        <h2 id="paywall-title">该功能为订阅会员专享</h2>
        <p id="paywall-desc">升级订阅可解锁无限 AI 创作、全套疗愈课程与 1v1 疗愈师预约。</p>
        <div class="modal-actions">
          <button id="paywall-go" class="btn btn-primary">查看订阅方案</button>
          <button id="paywall-close" class="btn btn-ghost">稍后再说</button>
        </div>
      </div>
    </div>

    <script type="module" src="voidScene.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="imageGen.js"></script>
    <script src="audio.js"></script>
    <script src="haptics.js"></script>
    <script src="app.js"></script>
  </body>
</html>
