# Cloudflare Pages + Functions 配置
# 部署对象：心绘 ArtMind（静态前端 web/ + Pages Functions API + D1 数据库）

name = "cureblue"
compatibility_date = "2024-11-01"

# 静态资源目录（Cloudflare Pages 会托管此目录，functions/ 自动编译为 API 路由）
pages_build_output_dir = "web"

# D1 数据库绑定：代码中通过 env.DB 访问
# database_id 需在创建 D1 后填写：wrangler d1 create artmind
[[d1_databases]]
binding = "DB"
database_name = "artmind"
database_id = "9b99f0b4-0124-4af6-9cdd-bab22d8441ba"

# Workers AI：没有方舟密钥时的生图和朗读回退（env.AI）
[ai]
binding = "AI"

# 生图模型。密钥 ARK_API_KEY 只放在 Pages Secret，不写进仓库。
[vars]
ARK_IMAGE_MODEL = "doubao-seedream-5-0-pro-260628"
ARK_IMAGE_SIZE = "2K"
